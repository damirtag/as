services:
  postgres:
    image: postgres:16
    container_name: as_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set}
      POSTGRES_DB: ${DB_NAME:-asdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: as_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: as_api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    environment:
      PORT: 4000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_NAME: ${DB_NAME:-asdb}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS:-}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TTL: 30m
      JWT_REFRESH_TTL: 30d

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: as_web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: local
      VITE_PORT: 3000
      VITE_AUTH_URL: http://localhost:4000/auth
      VITE_GQL_URL: http://localhost:4000/graphql

volumes:
  postgres_data:
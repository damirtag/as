query GetComments($quoteId: ID!, $pagination: PaginationInput) {
  findOneQuoteType(id: $quoteId) {
    commentsPaginated(pagination: $pagination) {
      items {
        id
        text
        userId
        createdAt
        user {
          username
        }
      }
      total
      page
      totalPages
    }
  }
}
